workflows:
  android-release:
    name: Android Release
    instance_type: mac_mini_m1
    scripts:
      - name: 1. Generate Android Baru
        script: flutter create .
      - name: 2. Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk  # <--- INI YANG DITAMBAH
